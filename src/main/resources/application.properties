spring.application.name=demo
spring.security.user.name=javainuse
spring.security.user.password=javainuse

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#logging.level.org.hibernate.orm.results=TRACE
#logging.level.org.hibernate.resource.transaction=DEBUG

# Retire connections at 4 minutes (240,000 ms) — safely under Docker Desktop's proxy timeout
spring.datasource.hikari.max-lifetime=240000

# Ping idle connections every 30 seconds (30,000 ms) to keep the localhost port-forward alive
spring.datasource.hikari.keepalive-time=30000

# Close extra idle connections after 2 minutes (120,000 ms)
spring.datasource.hikari.idle-timeout=120000

# Keep a minimal pool size during local dev to reduce stale sockets
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=qwen2.5:0.5b
langchain4j.ollama.streaming-chat-model.timeout=PT15M










